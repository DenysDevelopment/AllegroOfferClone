<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FF6B35'/><path d='M9 22V10h3.6l3.4 7.5L19.4 10H23v12h-2.6V14.2L17.1 22h-2.2l-3.3-7.8V22z' fill='white'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Клонирование оферт Allegro</title>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('allegro.theme');
          if (pref !== 'light' && pref !== 'dark' && pref !== 'system')
            pref = 'system';
          var sysDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'system' ? (sysDark ? 'dark' : 'light') : pref;
          var root = document.documentElement;
          if (theme === 'dark') root.classList.add('dark');
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-app text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
