services:
  app:
    # CI builds and pushes this image to GHCR on every push to main.
    # `build: .` is kept as a fallback for the first bootstrap (deploy-vps.sh)
    # and for local builds (`docker compose build`). On the VPS, deploys
    # use `docker compose pull` to fetch the prebuilt image.
    image: ghcr.io/denysdevelopment/allegroofferclone:latest
    build: .
    container_name: allegro-clone
    restart: unless-stopped
    # By default we expose 3000 on loopback so a host-level Caddy can proxy.
    # When a docker-Caddy stack is detected, the deploy script writes a
    # docker-compose.override.yml that joins that stack's network and removes
    # the host port mapping.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
