services:
  app:
    build: .
    image: allegro-clone:latest
    container_name: allegro-clone
    restart: unless-stopped
    # No host port exposure — the existing CRM Caddy reaches us
    # by container name (`allegro-clone:3000`) on the shared docker network.
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    networks:
      - default
      - shorterlink_default
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  shorterlink_default:
    external: true
